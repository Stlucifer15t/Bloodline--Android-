[versions]
# Android Gradle Plugin 8.13 requires Gradle >= 8.13 and JDK 17.
# See https://developer.android.com/build/releases/gradle-plugin
agp = "8.13.0"
gradle = "8.13.0"
kotlin = "2.2.20"

# Android platform levels.
# minSdk 26 == Android 8.0 Oreo, the same floor used by Winlator, which is the
# lowest version that comfortably supports the ARM64 userland a Wine/Box86
# runtime needs.
minSdk = "26"
targetSdk = "36"
compileSdk = "36"

# Application version.
#
# versionCode MUST increase with every merged change. It is the only thing
# Android looks at when deciding whether an APK is an update: two builds that
# carry the same versionCode are the same build as far as the installer is
# concerned, so a new APK will not be installed over the old one. Bump it in
# the same commit as the change, not afterwards.
versionCode = "3"
versionName = "0.3.0"

# Libraries. Kept deliberately small: AppCompat for a custom (non-Material)
# dark theme, androidx.core for tinting/compat helpers, JUnit for unit tests.
appcompat = "1.7.0"
coreKtx = "1.15.0"
documentfile = "1.0.1"
junit = "4.13.2"

# Archive decompression. Both are needed, not one: the upstream runtime
# packages use a private ".wcp" extension over a tar archive compressed with
# either XZ or Zstandard, and trying one and falling back is what the
# upstream installer itself does. xz is pure Java and in the public domain;
# zstd-jni is the reference Zstandard binding (BSD-2).
xz = "1.9"
zstdJni = "1.5.6-3"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
