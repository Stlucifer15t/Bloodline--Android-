# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Reuse task outputs across builds and CI runs.
org.gradle.caching=true

# AndroidX is the only supported artifact namespace for this project.
android.useAndroidX=true

# Generate R classes scoped to each module so resource names cannot collide
# once extra modules (for example a native runtime module) are added.
android.nonTransitiveRClass=true

# Kotlin style used by the IDE formatter.
kotlin.code.style=official
