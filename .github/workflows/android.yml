name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      # contents: write is here for exactly one thing: attaching the upstream
      # package report to the commit as a comment. Nothing in this job pushes,
      # tags or creates a release, and a report nobody can find is the reason
      # the permission is being widened rather than the report being dropped.
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # GitHub's ubuntu runners ship the Android SDK preinstalled, so we only
        # need to accept the licences and make sure the platform we compile
        # against is present. No third-party setup action is required.
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found on the runner (ANDROID_HOME='$SDK')"
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            ls -R "$SDK/cmdline-tools" | head -n 20
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/licenses"
          # Accept every licence prompt non-interactively.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "Installed platforms:"
          ls "$SDK/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check the version code was bumped
        # Android treats two APKs with the same versionCode as the same build,
        # so a change that does not bump it cannot be installed over the
        # previous APK. This fails the build rather than shipping an APK the
        # user has to uninstall first.
        #
        # What it compares against depends on the event, and getting that wrong
        # is what turned main red. On a push, the commit being built *is* the
        # new tip of main, so fetching main and diffing it against HEAD
        # compares the commit with itself and can only ever report "not
        # bumped". The meaningful question — "was this bigger than what it
        # replaces?" — is answered by the previous tip of main.
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.ref }}" ]; then
            BASE_LABEL="${{ github.event.pull_request.base.ref }}"
            git fetch --no-tags origin "$BASE_LABEL" --depth=1
            BASE_REV="FETCH_HEAD"
          else
            BASE_LABEL="the previous tip of main"
            git fetch --no-tags origin main --depth=2
            BASE_REV="FETCH_HEAD^1"
          fi
          code() {
            git show "$1:gradle/libs.versions.toml" \
              | grep -E '^versionCode = ' | head -n1 | grep -oE '[0-9]+'
          }
          HEAD_CODE="$(code HEAD)"
          BASE_CODE="$(code "$BASE_REV")"
          echo "versionCode: base($BASE_LABEL)=$BASE_CODE head=$HEAD_CODE"
          if [ -z "$HEAD_CODE" ] || [ -z "$BASE_CODE" ]; then
            echo "::error::Could not read versionCode from gradle/libs.versions.toml"
            exit 1
          fi
          if [ "$HEAD_CODE" -le "$BASE_CODE" ]; then
            echo "::error::versionCode is $HEAD_CODE but $BASE_LABEL is already at $BASE_CODE."
            echo "::error::Bump versionCode (and versionName) in gradle/libs.versions.toml so this APK installs as an update."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee gradle-tests.log

      - name: Report how many unit tests ran
        # "BUILD SUCCESSFUL" does not say over how many tests. The count is read
        # from the XML the test task writes, because that is the only place it
        # exists, and printed into the job summary so that a change which
        # quietly stops running tests is visible rather than assumed away.
        #
        # Deliberately before the upstream step: that one re-runs the same task
        # with a --tests filter, which replaces the results directory with a
        # single file.
        if: always()
        run: python3 tools/test-summary.py app/build/test-summary.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the upstream packages really download and unpack
        # The only step that fetches the actual Wine and WoW64 packages from
        # their pinned URLs. Everything else in the suite runs against data we
        # wrote, and three things about these packages were inferred from
        # reading other people's source rather than observed: the container
        # format behind the private `.wcp` extension, the internal layout, and
        # the name and location of the WoW64 DLL. This replaces inference with
        # observation, and prints the real checksums and layout so they can be
        # pinned rather than guessed.
        #
        # Non-blocking on purpose: it depends on GitHub's release host being
        # reachable, and a network hiccup must not fail a build whose APKs are
        # fine. The report is the deliverable, and it is in the job log either
        # way. Wine is 226 MB, so it is fetched only on a manual dispatch.
        id: upstream
        continue-on-error: true
        env:
          BLOODLINE_VERIFY_PACKAGES: "1"
          BLOODLINE_VERIFY_WINE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest \
            --tests "*UpstreamPackageVerificationTest*" 2>&1 | tee gradle-upstream.log

      - name: Publish the upstream package report
        # The report is written to a file because Gradle hides test output, and
        # published because an artifact has to be downloaded to be read.
        # Manual dispatch only: it is the run that also fetches Wine, and a
        # comment on every pull request would be noise.
        #
        # It is attached to the commit, not to a pull request number. It used to
        # post to PR 8, hardcoded, and kept reporting success long after PR 8
        # was merged and the comment stopped appearing anywhere — a reporting
        # channel that fails silently is worse than none, because the numbers
        # still look like they are being published. A commit comment works for
        # a pull request, a push and a merged branch alike, and it is readable
        # through the API by anything that needs to check what a run found.
        if: github.event_name == 'workflow_dispatch' && always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPORT="app/build/upstream-packages.txt"
          if [ ! -s "$REPORT" ]; then
            echo "No upstream report was produced."
            exit 0
          fi
          {
            echo "### Upstream package verification"
            echo
            echo "Fetched from the pinned release URLs and installed through the real"
            echo "acquisition path. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            cat "$REPORT"
            echo '```'
          } > /tmp/upstream-comment.md
          # The test count travels with it: the job summary is the only other
          # place it appears, and that is not readable from outside the run.
          if [ -s app/build/test-summary.md ]; then
            {
              echo
              cat app/build/test-summary.md
            } >> /tmp/upstream-comment.md
          fi
          # On the run's own summary first, so it is there even if the API is
          # unreachable.
          cat /tmp/upstream-comment.md >> "$GITHUB_STEP_SUMMARY"

          # Built as JSON rather than passed with -F body=@file: it says what
          # is being sent, and jq is on every runner.
          jq -n --rawfile body /tmp/upstream-comment.md '{body: $body}' \
            > /tmp/upstream-comment.json
          gh api -X POST \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input /tmp/upstream-comment.json

          # And on the pull request too, when there is one to put it on.
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file /tmp/upstream-comment.md
          fi

      - name: Check the manifest declares what the downloader needs
        # The runtime downloads Wine, so the app needs android.permission.INTERNET.
        # It was absent for the whole of the work that built the downloader, and
        # the first real download on a real phone failed inside
        # URL.openConnection() with "Permission denied".
        #
        # No unit test can catch this. Every one of them hands
        # RuntimePackageManager either a fake or a server on localhost, and CI
        # never installs the APK. The bug is a missing declaration rather than
        # wrong code, which is exactly the shape a unit test cannot see, so the
        # manifest is checked directly against the code that needs it.
        run: |
          set -euo pipefail
          MANIFEST=app/src/main/AndroidManifest.xml
          if grep -rql "HttpURLConnection\|URL(" app/src/main/java; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              echo "::error::$MANIFEST does not declare android.permission.INTERNET"
              echo "::error::The runtime fetches Wine over HTTP; without this the first download fails with Permission denied."
              exit 1
            fi
            echo "Manifest declares INTERNET, and the downloader needs it."
          fi

      - name: Run Android lint
        id: lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:lintDebug 2>&1 | tee gradle-lint.log

      - name: Build debug APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee gradle-assemble.log

      - name: Verify the native probes are packaged
        # Both probes are executables renamed to lib*.so, because Android only
        # extracts (and permits executing) files that look like shared
        # libraries. If either is missing from lib/<abi>/, the launcher cannot
        # measure the device and the future runtime cannot be started.
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "Inspecting $APK"

          for PROBE in libnative_probe.so libruntime_probe.so; do
            if unzip -l "$APK" | grep -E "lib/[^/]+/$PROBE"; then
              echo "$PROBE found in the APK."
            else
              echo "::error::$PROBE is missing from the APK"
              unzip -l "$APK" | grep -E "lib/" | head -n 40
              exit 1
            fi
          done

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK was produced in app/build/outputs/apk/debug"
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          ls -lh app/build/outputs/apk/debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bloodlines-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Prepare the release signing key
        # Optional. When repository secrets provide the real key it is decoded
        # here and used for both APKs. Without them the build falls back to the
        # committed project key, which is stable but not a secret; see
        # tools/make-signing-key.py.
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOODLINE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.BLOODLINE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/bloodline-release.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Release APK will be signed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets configured: both APKs are signed with the committed project key instead."
          fi

      - name: Build release APK
        id: assemble_release
        env:
          BLOODLINE_STORE_PASSWORD: ${{ secrets.BLOODLINE_STORE_PASSWORD }}
          BLOODLINE_KEY_ALIAS: ${{ secrets.BLOODLINE_KEY_ALIAS }}
          BLOODLINE_KEY_PASSWORD: ${{ secrets.BLOODLINE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-release.log

      - name: Verify the APK signatures
        # An APK signed with a key that changes between runs cannot be
        # installed over the previous one: the user has to uninstall first.
        # This proves both APKs are signed, and with the same certificate.
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          for APK in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$APK" ] || continue
            echo "== $APK"
            "$APKSIGNER" verify --print-certs --verbose "$APK" | grep -E "Verifies|DN:|SHA-?256|WARNING|DOES NOT"
          done

          DEBUG_CERT=$("$APKSIGNER" verify --print-certs "$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)" | grep -o 'DN:.*' | head -n 1)
          RELEASE_CERT=$("$APKSIGNER" verify --print-certs "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" | grep -o 'DN:.*' | head -n 1)

          if [ -z "$DEBUG_CERT" ] || [ -z "$RELEASE_CERT" ]; then
            echo "::error::An APK was built without a signature"
            exit 1
          fi
          if [ "$DEBUG_CERT" != "$RELEASE_CERT" ]; then
            echo "::error::The debug and release APKs are signed differently: $DEBUG_CERT vs $RELEASE_CERT"
            exit 1
          fi
          echo "Both APKs are signed with $DEBUG_CERT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bloodlines-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloodlines-reports
          path: |
            gradle-*.log
            app/build/reports/**/*.html
            app/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Report the failure
        if: failure()
        continue-on-error: true
        # Two channels, because a CI error is useless if nobody can read it:
        # 1. a comment on the pull request, and
        # 2. annotations on the failing run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Reporting must never mask the real failure: a grep that finds
          # nothing must not abort this step.
          set +e
          {
            echo "### :x: Android CI failed"
            echo ""
            echo "Failing run: $RUN_URL"
            echo ""
            for LOG in gradle-tests.log gradle-lint.log gradle-assemble.log gradle-release.log; do
              if [ -s "$LOG" ]; then
                echo "<details open><summary><code>$LOG</code> — what went wrong</summary>"
                echo ""
                echo '```'
                # Gradle prints "* What went wrong:" before the stacktrace.
                awk '/^\* What went wrong:/{flag=1} flag' "$LOG" | head -n 40
                echo "..."
                grep -m 8 "Caused by:" "$LOG"
                echo "--- compile errors ---"
                grep -E "^e: " "$LOG" | head -n 25
                grep -E "error:|Unresolved reference" "$LOG" | head -n 15
                echo "--- failing tests ---"
                grep -E "FAILED|tests completed" "$LOG" | head -n 30
                echo '```'
                echo "</details>"
                echo ""
                echo "<details><summary><code>$LOG</code> — last 40 lines</summary>"
                echo ""
                echo '```'
                tail -n 40 "$LOG"
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
          } > failure-report.md

          # Gradle points at an HTML report nobody can read from a comment, so
          # the assertion messages come straight out of the JUnit XML.
          {
            echo "<details open><summary>Failing unit tests</summary>"
            echo ""
            echo '```'
            python3 .github/scripts/summarise-test-failures.py
            echo '```'
            echo "</details>"
            echo ""
          } >> failure-report.md

          if [ -n "${PR_NUMBER:-}" ] && gh pr comment "$PR_NUMBER" --body-file failure-report.md; then
            echo "Posted the failure report to pull request #$PR_NUMBER"
            exit 0
          fi

          # Fallback: surface the most useful lines as run annotations
          # (compile errors first, then Gradle's own summary). Runners show a
          # limited number of annotations, so keep the list short.
          for LOG in gradle-release.log gradle-assemble.log gradle-lint.log gradle-tests.log; do
            [ -s "$LOG" ] || continue
            {
              grep -E "^e: " "$LOG" | head -n 8
              awk '/What went wrong:/{flag=1} flag' "$LOG" | head -n 8
              grep -E "FAILED" "$LOG" | head -n 6
            } | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              echo "::error title=$LOG::$line"
            done
          done

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Bloodlines Android — build summary"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Unit tests | ${{ steps.tests.outcome }} |"
            echo "| Android lint | ${{ steps.lint.outcome }} |"
            echo "| Debug APK | ${{ steps.assemble.outcome }} |"
            echo "| Release APK (built; uploaded when signed) | ${{ steps.assemble_release.outcome }} |"
            echo ""
            if [ "${{ steps.assemble.outcome }}" = "success" ]; then
              echo "**Artifact:** \`${{ steps.apk.outputs.name }}\` (${{ steps.apk.outputs.size }})"
              echo ""
              echo "Download it from the *Artifacts* section of this run:"
              echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              echo "### :x: The build failed"
              echo ""
              echo "1. Open the failing step above and read the Gradle stacktrace."
              echo "2. \`bloodlines-reports\` (with \`gradle-*.log\`) is attached to this run."
              echo "3. Run the same command locally with \`./gradlew\` to reproduce."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
