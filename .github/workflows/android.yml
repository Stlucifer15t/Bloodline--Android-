name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # GitHub's ubuntu runners ship the Android SDK preinstalled, so we only
        # need to accept the licences and make sure the platform we compile
        # against is present. No third-party setup action is required.
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found on the runner (ANDROID_HOME='$SDK')"
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            ls -R "$SDK/cmdline-tools" | head -n 20
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/licenses"
          # Accept every licence prompt non-interactively.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
          echo "Installed platforms:"
          ls "$SDK/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee gradle-tests.log

      - name: Run Android lint
        id: lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:lintDebug 2>&1 | tee gradle-lint.log

      - name: Build debug APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee gradle-assemble.log

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK was produced in app/build/outputs/apk/debug"
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          ls -lh app/build/outputs/apk/debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bloodlines-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-logs
          path: gradle-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report the failure on the pull request
        # Without this, the only way to read a CI error is to dig through the
        # Actions UI. The failing Gradle output is posted straight into the PR.
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### :x: Android CI failed"
            echo ""
            echo "Failing run: $RUN_URL"
            echo ""
            for LOG in gradle-tests.log gradle-lint.log gradle-assemble.log; do
              if [ -s "$LOG" ]; then
                echo "<details><summary><code>$LOG</code> — last 150 lines</summary>"
                echo ""
                echo '```'
                tail -n 150 "$LOG"
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
          } > failure-report.md
          gh pr comment "$PR_NUMBER" --body-file failure-report.md

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Bloodlines Android — build summary"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Unit tests | ${{ steps.tests.outcome }} |"
            echo "| Android lint | ${{ steps.lint.outcome }} |"
            echo "| Debug APK | ${{ steps.assemble.outcome }} |"
            echo ""
            if [ "${{ steps.assemble.outcome }}" = "success" ]; then
              echo "**Artifact:** \`${{ steps.apk.outputs.name }}\` (${{ steps.apk.outputs.size }})"
              echo ""
              echo "Download it from the *Artifacts* section of this run:"
              echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            else
              echo "### :x: The build failed"
              echo ""
              echo "1. Open the failing step above and read the Gradle stacktrace."
              echo "2. \`gradle-failure-logs\` and \`test-and-lint-reports\` are attached to this run."
              echo "3. Run the same command locally with \`./gradlew\` to reproduce."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
